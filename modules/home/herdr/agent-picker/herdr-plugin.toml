id = "agent-picker"
name = "Agent Picker"
version = "0.1.0"
min_herdr_version = "0.7.3"
description = "Fuzzy picker over workspaces, tabs, and agents that leads with each agent's terminal title."
platforms = ["linux", "macos"]

# No [[build]] section: the plugin is a shell script, so there is nothing to
# compile. herdr runs the command as-is from the plugin directory.

[[actions]]
id = "open"
title = "Agent Picker: open"
contexts = ["workspace", "global"]
command = ["./agent-picker.sh", "open"]

[[panes]]
id = "picker"
title = "Agent Picker"
placement = "overlay"
command = ["./agent-picker.sh", "ui"]
